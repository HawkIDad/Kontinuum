services:
  notebytez-website:
    image: nginx:alpine
    container_name: notebytez-website
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - /media/data1/notebytez-website/site:/usr/share/nginx/html:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
